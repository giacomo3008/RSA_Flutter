name: rsa
description: A connected synthetic-data care coordination prototype.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: ^2.30.0
  sqlite3: ^3.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  timezone: ^0.10.1
  uuid: ^4.5.2
  crypto: ^3.0.6
  camera: ^0.11.2
  record: ^6.1.2
  audioplayers: ^6.5.1
  http: ^1.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/l10n/app_en.arb
    - lib/l10n/app_it.arb
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
